[project]
name = "inventory-management"
version = "0.1.0"
description = "Decision-Focused and Distributionally Robust Inventory Allocation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.4.0",
    "torch>=2.2.0",
    "pyepo>=1.0.0",
    "pyomo>=6.7.0",
    "highspy>=1.7.0",
    "scipy>=1.12.0",
    "plotly>=5.20.0",
    "streamlit>=1.32.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "duckdb>=1.0.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "kagglehub>=1.0.3",
]

[project.scripts]
inventory-di = "inventory_di.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inventory_di", "src/inventory_management"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "app", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E741"]
